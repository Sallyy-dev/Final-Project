components:
  schemas:
    Book:
      type: object
      required:
        - id
        - title
        - fullText
        - author
      properties:
        id:
          type: integer
          examples:
            - 12
            - 14
        title:
          type: string
          examples:
            - Pride and Prejudice
            - Moby-Dick
        fullText:
          type: string
          examples:
            - Lorem ipsum
        author:
          $ref: "#/components/schemas/Author"
    Author:
      type: object
      required:
        - id
        - name
        - address
        - city
        - numberOfBooksPublished
      properties:
        id:
          type: integer
          examples:
            - 1
            - 2
            - 3
        city:
          type: string
          examples:
            - New York
            - Boston
        name:
          type: string
          examples:
            - J.K. Rowling
            - Henry Miller
        address:
          type: string
          examples:
            - Lorem ipsum
        numberOfBooksPublished:
          type: string
          examples:
            - "1"
            - "3"
            - "10"
      description: Creator of books.
    BookCreate:
      type: object
      required:
        - fullText
        - authorId
        - title
      properties:
        title:
          type: string
          examples:
            - Lorem ipsum
        authorId:
          type: integer
          examples:
            - 1
            - 2
            - 3
        fullText:
          type: string
          examples:
            - Lorem ipsum
      description: Data transfer object for creating a new Book.
      x-fiddle-dto-info:
        baseSchemaName: Book
    BookSummary:
      type: object
      required:
        - id
        - author
        - title
      properties:
        id:
          type: number
          examples:
            - 1
            - 2
            - 3
        title:
          type: string
          examples:
            - Lorem ipsum
        author:
          $ref: "#/components/schemas/Author"
      x-fiddle-dto-info:
        baseSchemaName: Book
  responses:
    Conflict:
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
                examples:
                  - Lorem ipsum
      description: The request could not be completed due to a conflict with the
        current state of the resource. Resolve the conflict and try again.
    NotFound:
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
                examples:
                  - Lorem ipsum
      description: The server cannot find the requested resource. The endpoint may be
        invalid or the resource may no longer exist.
    BadRequest:
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
                examples:
                  - Lorem ipsum
      description: The server could not understand the request due to invalid syntax.
        The client should modify the request and try again.
    InternalServerErrror:
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
                examples:
                  - Lorem ipsum
      description: The server encountered an unexpected condition that prevented it
        from fulfilling the request. Report the issue to the support team if it
        persists.
  parameters:
    title:
      in: query
      name: title
      style: form
      schema:
        type: string
        examples:
          - Pride and Prejudice
          - Moby-Dick
      explode: false
      required: false
      description: Filter the list of books according to the title.
    author_id:
      name: author_id
      in: query
      description: Filter the list of books accodring to the `author_id`.
      schema:
        type: integer
        examples:
          - 1
          - 2
          - 23
      explode: false
      style: form
      allowReserved: false
      allowEmptyValue: false
    book_id:
      name: book_id
      in: path
      description: Path parameter to retrieve books by.
      schema:
        type: integer
        examples:
          - 1
          - 2
          - 3
      explode: false
      style: simple
      allowReserved: false
      allowEmptyValue: true
tags:
